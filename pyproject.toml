[project]
name = "hero"
version = "0.13.0"
description = "Python client for HERO"
readme = "README.md"
license = { text = "Proprietary" }
keywords = ["hero", "task engine", "data repo", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]
requires-python = ">=3.10,<=3.12"
authors = [
    { name = "Monte Lunacek", email = "monte.lunacek@nrel.gov" },
    { name = "Nick Wunder", email = "nick.wunder@nrel.gov" },
]
maintainers = [
    { name = "Monte Lunacek", email = "monte.lunacek@nrel.gov" },
    { name = "Nick Wunder", email = "nick.wunder@nrel.gov" },
    { name = "Joseph Smith", email = "joseph.smith@nrel.gov" },
]
dependencies = [
    "requests>=2.32.3",
    "tenacity>=8.3.0",
    "pyjwt>=2.8.0",
    "tqdm>=4.66.4",
    "cryptography>=44.0.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.5",
]

[project.urls]
Homepage = "https://github.nrel.gov/Hero/hero"
Documentation = "https://github.nrel.gov/Hero/hero"
Repository = "https://github.nrel.gov/Hero/hero"
"Bug Tracker" = "https://github.nrel.gov/Hero/hero/issues"

[tool.pytest.ini_options]
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
]
