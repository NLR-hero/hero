# This workflow will run the Hero unit tests on every git push

# This Github Action is currently using pytest-github-report: https://github.com/vsoch/pytest-github-report
# pytest-github-report is an attempt to have failing test error messages display directly on the Github pull requests page
# pytest-github-report is installed through requirements.txt and invoked through the environment variable below

# Another add-on is pytest-results-actions https://github.com/marketplace/actions/pytest-results-actions
# It uses a pytest generated JUnit XML file to surface failing tests
# It is not currently used due to the former extension's slightly better readability

name: Unit Tests

on: [push]
# on:
#     pull_request:

jobs:
    build:
  
      runs-on: [ self-hosted ]
      strategy:
        matrix:
          python-version: ["3.9"]
  
      steps:
        - name: Check out repo
          uses: actions/checkout@v3

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v4
          with:
            python-version: ${{ matrix.python-version }}

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            # not sure if below line works, have to test
            python setup.py develop 
            pip install -r requirements.txt
            pip install -r dev-requirements.txt

        - name: Run Pytest test suite via environment with pytest-github-report
          env:
              pytest_github_report: true
              pytest_verbosity: 2
          run: |
            # pytest tests/aws/test_aws_sqs.py -v -s
            ./bin/test.sh