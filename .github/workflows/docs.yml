# This workflow will publish pdoc to Github Pages on each published release

# How it works:
# This workflow runs pdoc.sh which generates the documentation
# The static documentation pages gets bundled up into an artifact as a tarball
# In the deploy phase the artifact gets uploaded to Github Pages

name: pdoc to Github Pages

# build the documentation whenever a pull request is made
# on:
#     pull_request:

# build the documentation whenever there are new commits on main
# on:
    # push:
    #   branches:
        # - main
      # Alternative: only build for tags.
      # tags:
      #   - '*'

# build the documentation whenever a release is created, edited, or published
on:
  push:
    branches:
      - main

# security: restrict permissions for CI jobs.
permissions:
    contents: read

jobs:
    # Build the documentation and upload the static HTML files as an artifact.
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        # ADJUST THIS: install all dependencies (including pdoc)
        - run: pip install .
        - run: pip install pdoc3
        # Build HTML docs. --html is required (pdoc3 defaults to markdown).
        # lunr_search is disabled: it needs a Node subprocess and crashes in CI.
        - run: pdoc --html -c 'lunr_search=None' ./hero --template-dir ./pdoc/templates --output-dir docs
        # pdoc3 nests output under docs/hero/; add a root index that redirects there.
        - run: echo '<!doctype html><meta http-equiv="refresh" content="0; url=hero/">' > docs/index.html
        - uses: actions/upload-pages-artifact@v3
          with:
            path: docs

    # Deploy the artifact to GitHub pages.
    # This is a separate job so that only actions/deploy-pages has the necessary permissions.
    deploy:
      needs: build
      runs-on: ubuntu-latest
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - id: deployment
          uses: actions/deploy-pages@v4
